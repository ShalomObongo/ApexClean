name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0). Produces a draft release.'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # release notes are generated from history

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            DRAFT=true
          else
            VERSION="${GITHUB_REF_NAME#v}"
            DRAFT=false
          fi

          # Reject anything that is not a plain semantic version. CFBundleVersion
          # comparison misbehaves on malformed strings and Sparkle-style updaters
          # silently mis-order releases.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semantic version"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "draft=$DRAFT"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Report toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run the test suite
        run: swift test

      # -----------------------------------------------------------------------
      # Signing is conditional. Without credentials the workflow still produces a
      # usable ad-hoc build rather than failing, but it labels it clearly so an
      # unsigned artefact can never be mistaken for a distributable one.
      # -----------------------------------------------------------------------
      - name: Detect signing credentials
        id: creds
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          if [ -n "$CERTIFICATE" ] && [ -n "$CERTIFICATE_PASSWORD" ] && [ -n "$SIGNING_IDENTITY" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Developer ID configured — building ad-hoc signed. \
          The release will ship with first-launch instructions. Notarisation needs a \
          paid Apple Developer Program membership."
          fi

          if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No notarisation credentials — the artefact will not be notarised."
          fi

      - name: Import signing certificate
        if: steps.creds.outputs.sign == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # A dedicated, ephemeral keychain. Never touch the runner default.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          # Lets codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build universal app bundle
        env:
          UNIVERSAL: '1'
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN_IDENTITY: ${{ steps.creds.outputs.sign == 'true' && secrets.MACOS_SIGNING_IDENTITY || '-' }}
        run: make app

      - name: Verify the artifact
        run: |
          BIN=dist/ApexClean.app/Contents/MacOS/ApexClean
          ARCHS="$(lipo -archs "$BIN")"
          echo "architectures: $ARCHS"
          for arch in arm64 x86_64; do
            case "$ARCHS" in
              *"$arch"*) ;;
              *) echo "::error::release binary is missing $arch"; exit 1 ;;
            esac
          done
          codesign --verify --deep --strict --verbose=2 dist/ApexClean.app

          ACTUAL="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            dist/ApexClean.app/Contents/Info.plist)"
          [ "$ACTUAL" = "${{ steps.version.outputs.version }}" ] \
            || { echo "::error::bundle version is $ACTUAL, expected ${{ steps.version.outputs.version }}"; exit 1; }

      - name: Notarize and staple
        if: steps.creds.outputs.sign == 'true' && steps.creds.outputs.notarize == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          # notarytool takes an archive, not a bundle.
          ditto -c -k --sequesterRsrc --keepParent dist/ApexClean.app "$RUNNER_TEMP/notarize.zip"

          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait --timeout 30m

          # Stapling lets the app launch on a Mac that is offline.
          xcrun stapler staple dist/ApexClean.app
          xcrun stapler validate dist/ApexClean.app
          spctl --assess --type execute --verbose=4 dist/ApexClean.app

      - name: Package release assets
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.creds.outputs.sign }}
        run: |
          mkdir -p artifacts

          # ditto, not zip: it preserves symlinks, resource forks and the
          # signature. A zip-mangled .app fails Gatekeeper on arrival.
          ditto -c -k --sequesterRsrc --keepParent \
            dist/ApexClean.app "artifacts/ApexClean-$VERSION-universal.zip"

          # A drag-to-Applications installer rather than a bare disk image.
          STAGING="$RUNNER_TEMP/dmg"
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          ditto dist/ApexClean.app "$STAGING/ApexClean.app"
          ln -s /Applications "$STAGING/Applications"

          # Without notarisation the first launch is blocked, and since macOS 15
          # the old right-click-Open bypass no longer works. Ship the current
          # instructions where they are needed, not only in the release notes.
          if [ "$SIGNED" != "true" ]; then
            cat > "$STAGING/READ ME FIRST.txt" <<'TXT'
          Opening ApexClean the first time
          ================================

          This build is not notarised by Apple, so macOS blocks it on first
          launch. This is expected. Notarisation requires a paid Apple Developer
          Program membership; ApexClean is free software and does not have one.

          To open it:

            1. Drag ApexClean to Applications.
            2. Double-click it. macOS will say it cannot verify the developer.
               Click Done.
            3. Open System Settings > Privacy & Security.
            4. Scroll to Security. Next to "ApexClean was blocked", click
               Open Anyway, then confirm.

          You only need to do this once.

          Note: on macOS 15 and later, right-click > Open no longer works. The
          Privacy & Security route above is the current one.

          Prefer the terminal? This does the same thing:

            xattr -dr com.apple.quarantine /Applications/ApexClean.app

          Or skip all of it and build from source, which is never quarantined:

            git clone https://github.com/ShalomObongo/ApexClean.git
            cd ApexClean && make app
          TXT
          fi

          hdiutil create -volname "ApexClean $VERSION" \
            -srcfolder "$STAGING" -ov -format UDZO -quiet \
            "artifacts/ApexClean-$VERSION-universal.dmg"

          cd artifacts
          shasum -a 256 ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A disk image that will not mount, or that carries a broken bundle, is
      # worse than no release at all — so open it and look.
      - name: Verify the disk image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MOUNT="$RUNNER_TEMP/verify"
          mkdir -p "$MOUNT"
          hdiutil attach "artifacts/ApexClean-$VERSION-universal.dmg" \
            -mountpoint "$MOUNT" -nobrowse -quiet

          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT

          [ -d "$MOUNT/ApexClean.app" ] || { echo "::error::no app in the disk image"; exit 1; }
          [ -L "$MOUNT/Applications" ] || { echo "::error::no Applications shortcut"; exit 1; }

          codesign --verify --deep --strict "$MOUNT/ApexClean.app"
          lipo -archs "$MOUNT/ApexClean.app/Contents/MacOS/ApexClean"
          echo "Disk image verified."

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.creds.outputs.sign }}
          NOTARIZED: ${{ steps.creds.outputs.notarize }}
        run: |
          PREVIOUS="$(git tag --sort=-version:refname --list 'v*' \
            | grep -v "^v$VERSION$" | head -n1 || true)"

          {
            echo "## ApexClean $VERSION"
            echo
            echo "Universal build for Apple Silicon and Intel. Requires macOS 14 or later."
            echo
            echo "**[ApexClean-$VERSION-universal.dmg](https://github.com/${{ github.repository }}/releases/download/v$VERSION/ApexClean-$VERSION-universal.dmg)** — open it and drag ApexClean to Applications."
            echo

            if [ "$SIGNED" != "true" ]; then
              echo "### First launch"
              echo
              echo "This build is **not notarised**, so macOS blocks it the first time."
              echo "Notarisation requires a paid Apple Developer Program membership;"
              echo "ApexClean is free software and does not have one. The app is ad-hoc"
              echo "signed, so its contents are still tamper-evident."
              echo
              echo "1. Double-click ApexClean. macOS says it cannot verify the developer — click **Done**."
              echo "2. Open **System Settings → Privacy & Security**."
              echo "3. Scroll to **Security**, and next to \"ApexClean was blocked\" click **Open Anyway**."
              echo
              echo "Once only. On macOS 15 and later, right-click → Open no longer works —"
              echo "the Privacy & Security route above is the current one."
              echo
              echo "Or from the terminal:"
              echo
              echo '```sh'
              echo "xattr -dr com.apple.quarantine /Applications/ApexClean.app"
              echo '```'
              echo
              echo "Or build from source, which is never quarantined: \`make app\`."
              echo
            elif [ "$NOTARIZED" != "true" ]; then
              echo "> [!WARNING]"
              echo "> Signed with a Developer ID but **not notarised**. Gatekeeper will warn on"
              echo "> first launch."
              echo
            fi

            echo "### Changes"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log --no-merges --pretty='- %s' "$PREVIOUS..HEAD"
            else
              git log --no-merges --pretty='- %s' -n 40
            fi
            echo
            echo "### Verifying your download"
            echo
            echo '```sh'
            echo "shasum -a 256 -c SHA256SUMS.txt"
            echo '```'
            echo
            echo "ApexClean is free software under GPL-3.0, built on [Mole](https://github.com/tw93/mole)."
          } > release-notes.md

          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DRAFT: ${{ steps.version.outputs.draft }}
        run: |
          ARGS=(--title "ApexClean $VERSION" --notes-file release-notes.md)

          # Pushing a tag is the deliberate act, so a tagged build publishes even
          # when it is unsigned — the notes say plainly what that means. Manual
          # dispatch runs stay drafts so the pipeline can be exercised safely.
          if [ "$DRAFT" = "true" ]; then
            ARGS+=(--draft)
          fi
          case "$VERSION" in *-*) ARGS+=(--prerelease) ;; esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* "${ARGS[@]}"
          fi

      - name: Clean up keychain
        if: always() && steps.creds.outputs.sign == 'true'
        run: security delete-keychain "$KEYCHAIN" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-artifacts-${{ steps.version.outputs.version }}
          path: artifacts/
          retention-days: 90
